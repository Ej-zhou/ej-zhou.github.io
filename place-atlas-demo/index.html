<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoints / 去处</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="place-rail" aria-label="Saved places">
        <header class="brand-block">
          <div>
            <h1>去处 / Waypoints</h1>
          </div>
          <div class="focus-toggle" role="group" aria-label="Place scope">
            <button class="focus-btn" type="button" data-focus="all" title="All places">A</button>
            <button class="focus-btn" type="button" data-focus="visited" title="Visited places">V</button>
            <button class="focus-btn active" type="button" data-focus="focused" title="Focused: places I know">F</button>
          </div>
        </header>

        <div class="home-switcher" aria-label="Map focus">
          <button class="chip" type="button" data-region="china">Hangzhou</button>
          <button class="chip active" type="button" data-region="uk">Cambridge</button>
          <button class="chip" type="button" data-region="germany">Frankfurt</button>
        </div>

        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Temple, garden, city..." />
        </label>

        <section class="mini-stats" aria-label="Place summary">
          <div>
            <strong id="totalCount">0</strong>
            <span>saved</span>
          </div>
          <div>
            <strong id="visitedCount">0</strong>
            <span>visited</span>
          </div>
        </section>

        <section class="place-list" id="placeList" aria-label="Place list"></section>
      </aside>

      <section class="map-section" aria-label="Map">
        <div class="map-canvas mapstyle-parchment">
          <div id="actualMap" class="actual-map" aria-label="Interactive places map"></div>
          <button id="mapStyleToggle" class="map-style-toggle" type="button" aria-label="Change map style" title="Change map style">
            <span class="map-style-swatch" aria-hidden="true"></span>
            <span id="mapStyleName">Parchment</span>
          </button>
          <div class="map-fallback" id="mapFallback">
            Map tiles need an internet connection. The saved places are still available in the list.
          </div>
        </div>
      </section>

      <aside class="detail-panel" id="detailPanel" aria-label="Place details"></aside>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
